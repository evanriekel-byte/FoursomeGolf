# XcodeGen spec — generates Foursome.xcodeproj from the sources in Foursome/.
# Lets the project be created from the terminal instead of clicked together in
# Xcode's GUI, and keeps the .xcodeproj out of git (it's a generated artifact
# that merges badly).
#
#   brew install xcodegen
#   xcodegen generate
#   open Foursome.xcodeproj

name: Foursome

options:
  bundleIdPrefix: com.foursome
  deploymentTarget:
    iOS: "17.0"          # SwiftData needs 17
  createIntermediateGroups: true

targets:
  Foursome:
    type: application
    platform: iOS
    sources:
      - path: Foursome
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foursome.app
        PRODUCT_NAME: Foursome
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

  # Unit tests, hosted in the app so they can @testable import Foursome.
  FoursomeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FoursomeTests
    dependencies:
      - target: Foursome
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Foursome.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Foursome"
        BUNDLE_LOADER: "$(TEST_HOST)"

# XcodeGen only shares schemes that are spelled out, and xcodebuild on CI needs
# a shared scheme to run the tests.
schemes:
  Foursome:
    build:
      targets:
        Foursome: all
        FoursomeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FoursomeTests
    archive:
      config: Release
